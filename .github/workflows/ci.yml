name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    name: Format, lint, build, decode
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml names the version and the wasm target; a bare
      # install reads it, so nothing here says "stable".
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The same path remapping as `just build`: rustc embeds source paths
      # (panic locations in dependencies), so without it every host builds a
      # different file and the check below could never pass.
      - name: Build the plugin
        run: |
          export RUSTFLAGS="-D warnings --remap-path-prefix=$HOME/.cargo/registry/src=/registry --remap-path-prefix=$PWD=/src"
          cargo build --release --locked --target wasm32-unknown-unknown

      - name: Install Typst 0.14.2, pinned by checksum
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/typst.tar.xz \
            https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz
          echo 'a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d  /tmp/typst.tar.xz' | sha256sum --check
          tar -xJf /tmp/typst.tar.xz -C /tmp
          install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: Install zbar and poppler
        run: sudo apt-get update && sudo apt-get install -y zbar-tools poppler-utils fonts-dejavu-core

      # Two passes. The committed qrypst.wasm is what Typst users get, so it is
      # tested as committed. Then the fresh Linux build is swapped in and tested
      # the same way, which is what proves the source still builds a working
      # plugin. The two files are not compared byte for byte: the macOS and
      # Linux toolchains do not produce identical wasm even with source paths
      # remapped, so that check could only ever fail. Same-host
      # reproducibility is checked in the release workflow instead.
      - name: Decode every code with the committed plugin
        run: tests/smoke.sh

      - name: Decode every code with the fresh build
        run: |
          cp target/wasm32-unknown-unknown/release/qrypst.wasm qrypst.wasm
          tests/smoke.sh
          git checkout -- qrypst.wasm
